[project]
name = "flyswatter-neural-worker"
version = "0.1.0"
description = "MaleCNS worker for Fly vs Flyswatter"
requires-python = ">=3.14"
dependencies = [
    "numpy==2.4.6",
    "pandas==3.0.5",
    "pyarrow==25.0.1",
    "Pillow==12.3.0",
    "pytest==9.1.1",
    "ruff==0.14.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv]
package = false
